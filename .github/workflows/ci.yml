name: CI Quality Gate & Supply Chain Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  NODE_ENV: test
  # Port 5433 avoids conflict with the runner's local PostgreSQL on 5432
  # Use qcet_test directly — matches the test-guard expected DB name
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/qcet_test?schema=public"

jobs:
  security-and-lint:
    name: Security, Lint & Quality Audit
    runs-on: [self-hosted, Linux, X64, qcet]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qcet_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Verify Fresh Database Migrations
        run: npm run db:migrate:test-fresh

      - name: Verify Upgrade Database Migrations
        run: npm run db:migrate:test-upgrade

      - name: Apply Migrations for Drift Check
        run: npx prisma migrate deploy

      - name: Detect Unexpected Database Drift
        run: npm run db:drift:check

      - name: Run NPM Security Audit
        run: npm audit --audit-level=high

      - name: Run Linting / Code Quality Check
        run: npm run lint

  typecheck-and-test:
    name: TypeScript & Unit Test Suite
    runs-on: [self-hosted, Linux, X64, qcet]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qcet_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Migrations to Test Database
        run: npx prisma migrate deploy

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Execute Automated Test Suite
        run: npm test

  build-artifact:
    name: Standalone Build & Artifact Gate
    runs-on: [self-hosted, Linux, X64, qcet]
    needs: [security-and-lint, typecheck-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Application (Standalone)
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Upload Standalone Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qcet-standalone-build
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 7
          if-no-files-found: warn
