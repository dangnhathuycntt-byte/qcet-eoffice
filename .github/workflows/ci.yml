name: CI Quality Gate & Supply Chain Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  NODE_ENV: test
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/qcet_ci?schema=public"

jobs:
  security-and-lint:
    name: Security, Lint & Quality Audit
    runs-on: [self-hosted, Linux, X64, qcet]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Run NPM Security Audit
        run: npm audit --audit-level=high

      - name: Run Linting / Code Quality Check
        run: npm run lint

  typecheck-and-test:
    name: TypeScript & Unit Test Suite
    runs-on: [self-hosted, Linux, X64, qcet]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Execute Automated Test Suite
        run: npm test

  build-artifact:
    name: Standalone Build & Artifact Gate
    runs-on: [self-hosted, Linux, X64, qcet]
    needs: [security-and-lint, typecheck-and-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Application (Standalone)
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Upload Standalone Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qcet-standalone-build
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 7
          if-no-files-found: warn
