name: Continuous Deployment & Migration Gates

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      run_migrations:
        description: "Execute Prisma schema migrations"
        required: true
        default: true
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.environment || 'auto' }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Generate Deployment Metadata
    runs-on: ubuntu-latest
    outputs:
      git_sha: ${{ steps.meta.outputs.git_sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      build_id: ${{ steps.meta.outputs.build_id }}
      timestamp: ${{ steps.meta.outputs.timestamp }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      is_tag_release: ${{ steps.meta.outputs.is_tag_release }}
    steps:
      - name: Generate deployment identifiers
        id: meta
        run: |
          GIT_SHA="${{ github.sha }}"
          SHORT_SHA="${GIT_SHA:0:7}"
          BUILD_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          IS_TAG="false"
          RELEASE_TAG="none"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            IS_TAG="true"
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "git_sha=${GIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "timestamp=${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "is_tag_release=${IS_TAG}" >> "$GITHUB_OUTPUT"

          echo "### Deployment Metadata" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit SHA**: \`${GIT_SHA}\` (\`${SHORT_SHA}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build ID**: \`${BUILD_ID}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Timestamp**: \`${TIMESTAMP}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release Tag**: \`${RELEASE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Trigger Actor**: @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: [metadata]
    environment:
      name: staging
      url: https://staging.eoffice.qcet.edu.vn
    if: |
      github.ref == 'refs/heads/main' ||
      github.event.inputs.environment == 'staging' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment != 'production')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Migration Gate (Prisma Migrate Deploy)
        if: ${{ github.event.inputs.run_migrations != false }}
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          echo "Executing Prisma database migrations for Staging..."
          npx prisma migrate deploy

      - name: Build Next.js Application (Standalone)
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APP_VERSION: ${{ needs.metadata.outputs.short_sha }}
          NEXT_PUBLIC_DEPLOY_TIMESTAMP: ${{ needs.metadata.outputs.timestamp }}
        run: npm run build

      - name: Emit Deployment Receipt
        run: |
          mkdir -p .deploy
          cat <<EOF > .deploy/receipt.json
          {
            "environment": "staging",
            "gitSha": "${{ needs.metadata.outputs.git_sha }}",
            "shortSha": "${{ needs.metadata.outputs.short_sha }}",
            "buildId": "${{ needs.metadata.outputs.build_id }}",
            "deployedAt": "${{ needs.metadata.outputs.timestamp }}",
            "deployedBy": "${{ github.actor }}"
          }
          EOF
          echo "Staging deployment receipt written to .deploy/receipt.json"

  deploy-production:
    name: Deploy to Production Environment (Protected Release Gate)
    runs-on: ubuntu-latest
    needs: [metadata, deploy-staging]
    environment:
      name: production
      url: https://eoffice.qcet.edu.vn
    if: |
      always() &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped') &&
      (needs.metadata.outputs.is_tag_release == 'true' || github.event.inputs.environment == 'production')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Migration Gate (Prisma Migrate Deploy)
        if: ${{ github.event.inputs.run_migrations != false }}
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          echo "Executing Prisma database migrations for Production..."
          npx prisma migrate deploy

      - name: Build Next.js Application (Standalone)
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APP_VERSION: ${{ needs.metadata.outputs.release_tag != 'none' && needs.metadata.outputs.release_tag || needs.metadata.outputs.short_sha }}
          NEXT_PUBLIC_DEPLOY_TIMESTAMP: ${{ needs.metadata.outputs.timestamp }}
        run: npm run build

      - name: Emit Immutable Release Manifest
        run: |
          mkdir -p .deploy
          cat <<EOF > .deploy/production-manifest.json
          {
            "environment": "production",
            "releaseTag": "${{ needs.metadata.outputs.release_tag }}",
            "gitSha": "${{ needs.metadata.outputs.git_sha }}",
            "shortSha": "${{ needs.metadata.outputs.short_sha }}",
            "buildId": "${{ needs.metadata.outputs.build_id }}",
            "deployedAt": "${{ needs.metadata.outputs.timestamp }}",
            "deployedBy": "${{ github.actor }}"
          }
          EOF
          echo "Production deployment manifest written to .deploy/production-manifest.json"
