# Production Database Migration — Manual Trigger
#
# Runs `prisma migrate deploy` against the production database using:
# - Workspace bind-mount into node:20-alpine on qcet-network
# - All current repo migrations available (not baked into app image)
# - Resolves any failed migrations before applying
#
# Security:
#   - DATABASE_URL read from running app container env (masked immediately)
#   - PG credentials in chmod-600 files; never appear on CLI
#
# Usage:
#   gh workflow run migrate-production.yml -f confirm=migrate

name: Production Database Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'migrate' to confirm running prisma migrate deploy in production"
        required: true
        type: string

concurrency:
  group: production-migrate
  cancel-in-progress: false

env:
  # Python URL-parser script, base64-encoded to avoid heredoc/YAML conflicts.
  PY_URL_PARSER: >-
    aW1wb3J0IG9zLCBzeXMKZnJvbSB1cmxsaWIucGFyc2UgaW1wb3J0IHVybHNwbGl0LCB1bnF1
    b3RlCnVybCA9IG9zLmVudmlyb24uZ2V0KCJEQVRBQkFTRV9VUkwiLCAiIikKdSA9IHVybHNw
    bGl0KHVybCkKdmFscyA9IFsKICAgIHVucXVvdGUodS51c2VybmFtZSBvciAiIiksCiAgICB1
    bnF1b3RlKHUucGFzc3dvcmQgb3IgIiIpLAogICAgdW5xdW90ZSh1Lmhvc3RuYW1lIG9yICJs
    b2NhbGhvc3QiKSwKICAgIHN0cih1LnBvcnQgb3IgNTQzMiksCiAgICB1bnF1b3RlKCh1LnBh
    dGgubHN0cmlwKCIvIikuc3BsaXQoIj8iKVswXSBpZiB1LnBhdGggZWxzZSAicG9zdGdyZXMi
    KSksCl0KZm9yIHBhdGgsIHZhbCBpbiB6aXAoc3lzLmFyZ3ZbMTpdLCB2YWxzKToKICAgIHdp
    dGggb3BlbihwYXRoLCAidyIpIGFzIGY6CiAgICAgICAgZi53cml0ZSh2YWwpCiAgICBvcy5j
    aG1vZChwYXRoLCAwbzYwMCkK

jobs:
  migrate:
    name: Prisma Migrate Deploy (Production)
    runs-on: [self-hosted, Linux, X64, qcet]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "migrate" ]; then
            echo "ERROR: Must type 'migrate' exactly to confirm." >&2
            exit 1
          fi
          echo "Confirmation accepted."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (for prisma CLI in workspace)
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: node_modules/.bin/prisma generate

      - name: Find app container and network
        id: app
        run: |
          APP=$(docker ps --filter "name=qcet-app" --format '{{.Names}}' | head -1)
          if [ -z "$APP" ]; then
            APP=$(docker ps --filter "name=qcet" --format '{{.Names}}' \
              | grep -v "db\|clamav\|cloudflared\|tunnel" | head -1)
          fi
          if [ -z "$APP" ]; then
            echo "ERROR: No qcet app container is running." >&2
            docker ps --format '{{.Names}}' >&2
            exit 1
          fi
          DOCKER_NET=$(docker inspect "$APP" \
            --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' 2>/dev/null \
            | tr ' ' '\n' | grep -v '^$' | head -1)
          if [ -z "$DOCKER_NET" ]; then
            echo "ERROR: Could not determine Docker network from app container." >&2
            exit 1
          fi
          echo "app_container=$APP" >> "$GITHUB_OUTPUT"
          echo "docker_network=$DOCKER_NET" >> "$GITHUB_OUTPUT"
          echo "App container: $APP  |  Docker network: $DOCKER_NET"

      - name: Read and mask DATABASE_URL
        id: dburl
        env:
          APP_CONTAINER: ${{ steps.app.outputs.app_container }}
        run: |
          DB_URL=$(docker inspect "$APP_CONTAINER" \
            --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
            | grep '^DATABASE_URL=' | head -1 | cut -d= -f2-)
          if [ -z "$DB_URL" ]; then
            echo "ERROR: DATABASE_URL not found in app container env." >&2
            exit 1
          fi
          echo "::add-mask::$DB_URL"
          # Write to a step output file (value is masked in all future log output)
          printf 'DATABASE_URL=%s\n' "$DB_URL" > /tmp/migrate-dburl
          chmod 600 /tmp/migrate-dburl
          echo "db_url_file=/tmp/migrate-dburl" >> "$GITHUB_OUTPUT"
          echo "DATABASE_URL read and masked."

      - name: Check migration status (pre-migrate)
        env:
          APP_CONTAINER: ${{ steps.app.outputs.app_container }}
          DOCKER_NETWORK: ${{ steps.app.outputs.docker_network }}
        run: |
          echo "=== Current migration status ==="

          DB_URL=$(grep '^DATABASE_URL=' /tmp/migrate-dburl | cut -d= -f2-)
          echo "::add-mask::$DB_URL"

          TMPDIR_M=$(mktemp -d /tmp/migrate-check.XXXXXX)
          trap 'rm -rf "$TMPDIR_M"' EXIT

          printf '%s' "$PY_URL_PARSER" | tr -d ' \n' | base64 -d > "$TMPDIR_M/parse.py"
          DATABASE_URL="$DB_URL" python3 "$TMPDIR_M/parse.py" \
            "$TMPDIR_M/pg_user" "$TMPDIR_M/pg_pass" \
            "$TMPDIR_M/pg_host" "$TMPDIR_M/pg_port" "$TMPDIR_M/pg_db"
          PG_USER=$(cat "$TMPDIR_M/pg_user")
          PG_PASS=$(cat "$TMPDIR_M/pg_pass")
          PG_HOST=$(cat "$TMPDIR_M/pg_host")
          PG_PORT=$(cat "$TMPDIR_M/pg_port")
          PG_DB=$(cat   "$TMPDIR_M/pg_db")
          echo "DB: host=$PG_HOST port=$PG_PORT db=$PG_DB user=$PG_USER" >&2

          ENV_FILE="$TMPDIR_M/pgenv"
          printf 'PGPASSWORD=%s\n' "$PG_PASS" > "$ENV_FILE"
          chmod 600 "$ENV_FILE"

          APPLIED=$(docker run --rm \
            --network "$DOCKER_NETWORK" \
            --env-file "$ENV_FILE" \
            postgres:16-alpine \
            psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DB" -t -A \
              -c "SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL" \
            2>&1 | tr -d '[:space:]' || echo "PROBE_FAILED")
          echo "Applied migrations (before): $APPLIED"

          FAILED_MIGRATIONS=$(docker run --rm \
            --network "$DOCKER_NETWORK" \
            --env-file "$ENV_FILE" \
            postgres:16-alpine \
            psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DB" -t -A \
              -c "SELECT migration_name FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL ORDER BY started_at" \
            2>&1 || echo "PROBE_FAILED")
          echo "Failed migrations (if any): ${FAILED_MIGRATIONS:-none}"

          TOTAL_DIRS=$(find prisma/migrations -maxdepth 1 -mindepth 1 -type d | wc -l | tr -d ' ')
          echo "Migration directories in repo: $TOTAL_DIRS"

      - name: Resolve failed migrations (if any)
        env:
          DOCKER_NETWORK: ${{ steps.app.outputs.docker_network }}
        run: |
          DB_URL=$(grep '^DATABASE_URL=' /tmp/migrate-dburl | cut -d= -f2-)
          echo "::add-mask::$DB_URL"

          TMPDIR_R=$(mktemp -d /tmp/migrate-resolve.XXXXXX)
          trap 'rm -rf "$TMPDIR_R"' EXIT

          # Write DATABASE_URL env-file for docker run
          printf 'DATABASE_URL=%s\n' "$DB_URL" > "$TMPDIR_R/dbenv"
          chmod 600 "$TMPDIR_R/dbenv"

          # Find any migrations with started_at but no finished_at and no rolled_back_at
          printf '%s' "$PY_URL_PARSER" | tr -d ' \n' | base64 -d > "$TMPDIR_R/parse.py"
          DATABASE_URL="$DB_URL" python3 "$TMPDIR_R/parse.py" \
            "$TMPDIR_R/pg_user" "$TMPDIR_R/pg_pass" \
            "$TMPDIR_R/pg_host" "$TMPDIR_R/pg_port" "$TMPDIR_R/pg_db"
          PG_PASS=$(cat "$TMPDIR_R/pg_pass")
          PG_HOST=$(cat "$TMPDIR_R/pg_host")
          PG_PORT=$(cat "$TMPDIR_R/pg_port")
          PG_USER=$(cat "$TMPDIR_R/pg_user")
          PG_DB=$(cat   "$TMPDIR_R/pg_db")

          PG_ENV="$TMPDIR_R/pgenv"
          printf 'PGPASSWORD=%s\n' "$PG_PASS" > "$PG_ENV"
          chmod 600 "$PG_ENV"

          FAILED=$(docker run --rm \
            --network "$DOCKER_NETWORK" \
            --env-file "$PG_ENV" \
            postgres:16-alpine \
            psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DB" -t -A \
              -c "SELECT migration_name FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL ORDER BY started_at" \
            2>&1 || echo "")

          if [ -z "$FAILED" ]; then
            echo "No failed migrations found; skipping resolve step."
          else
            echo "Resolving failed migrations: $FAILED"
            while IFS= read -r MIG_NAME; do
              [ -z "$MIG_NAME" ] && continue
              echo "  -> prisma migrate resolve --rolled-back $MIG_NAME"
              docker run --rm \
                --network "$DOCKER_NETWORK" \
                --env-file "$TMPDIR_R/dbenv" \
                -e NODE_ENV=production \
                --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace,readonly" \
                -w /workspace \
                node:20-alpine \
                sh -c "node_modules/.bin/prisma migrate resolve --rolled-back '$MIG_NAME' 2>&1"
            done <<< "$FAILED"
            echo "All failed migrations resolved as rolled-back."
          fi

      - name: Run prisma migrate deploy (production)
        env:
          DOCKER_NETWORK: ${{ steps.app.outputs.docker_network }}
        run: |
          echo "=== RUNNING: prisma migrate deploy ==="
          echo "Actor: @${{ github.actor }}"
          echo "SHA: ${{ github.sha }}"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          DB_URL=$(grep '^DATABASE_URL=' /tmp/migrate-dburl | cut -d= -f2-)
          echo "::add-mask::$DB_URL"

          TMPDIR_D=$(mktemp -d /tmp/migrate-deploy.XXXXXX)
          trap 'rm -rf "$TMPDIR_D"' EXIT
          printf 'DATABASE_URL=%s\n' "$DB_URL" > "$TMPDIR_D/dbenv"
          chmod 600 "$TMPDIR_D/dbenv"

          # Run prisma migrate deploy using workspace bind-mount so all
          # current repo migrations (not just what's baked in app image) are used.
          docker run --rm \
            --network "$DOCKER_NETWORK" \
            --env-file "$TMPDIR_D/dbenv" \
            -e NODE_ENV=production \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace,readonly" \
            -w /workspace \
            node:20-alpine \
            sh -c "node_modules/.bin/prisma migrate deploy 2>&1"
          echo "prisma migrate deploy: complete"

      - name: Verify migration success
        env:
          DOCKER_NETWORK: ${{ steps.app.outputs.docker_network }}
        run: |
          echo "=== POST-MIGRATION VERIFICATION ==="

          DB_URL=$(grep '^DATABASE_URL=' /tmp/migrate-dburl | cut -d= -f2-)
          echo "::add-mask::$DB_URL"

          TMPDIR_V=$(mktemp -d /tmp/migrate-verify.XXXXXX)
          trap 'rm -rf "$TMPDIR_V"' EXIT

          printf '%s' "$PY_URL_PARSER" | tr -d ' \n' | base64 -d > "$TMPDIR_V/parse.py"
          DATABASE_URL="$DB_URL" python3 "$TMPDIR_V/parse.py" \
            "$TMPDIR_V/pg_user" "$TMPDIR_V/pg_pass" \
            "$TMPDIR_V/pg_host" "$TMPDIR_V/pg_port" "$TMPDIR_V/pg_db"
          PG_USER=$(cat "$TMPDIR_V/pg_user")
          PG_PASS=$(cat "$TMPDIR_V/pg_pass")
          PG_HOST=$(cat "$TMPDIR_V/pg_host")
          PG_PORT=$(cat "$TMPDIR_V/pg_port")
          PG_DB=$(cat   "$TMPDIR_V/pg_db")

          ENV_FILE="$TMPDIR_V/pgenv"
          printf 'PGPASSWORD=%s\n' "$PG_PASS" > "$ENV_FILE"
          chmod 600 "$ENV_FILE"

          APPLIED=$(docker run --rm \
            --network "$DOCKER_NETWORK" \
            --env-file "$ENV_FILE" \
            postgres:16-alpine \
            psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DB" -t -A \
              -c "SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL" \
            2>&1 | tr -d '[:space:]' || echo "PROBE_FAILED")
          echo "Applied migrations (after): $APPLIED"

          FO_EXISTS=$(docker run --rm \
            --network "$DOCKER_NETWORK" \
            --env-file "$ENV_FILE" \
            postgres:16-alpine \
            psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DB" -t -A \
              -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_name='file_objects'" \
            2>&1 | tr -d '[:space:]' || echo "PROBE_FAILED")
          echo "file_objects exists (1=yes, 0=no): $FO_EXISTS"

          if [ "$FO_EXISTS" != "1" ]; then
            echo "ERROR: file_objects table still missing after migration!" >&2
            exit 1
          fi
          echo "VERIFIED: file_objects exists. Migration complete."

      - name: Cleanup temp files
        if: always()
        run: rm -f /tmp/migrate-dburl || true

      - name: Summary
        if: always()
        run: |
          echo "### Production Migration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Actor: @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_STEP_SUMMARY"
