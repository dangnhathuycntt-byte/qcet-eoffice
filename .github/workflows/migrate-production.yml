# Production Database Migration — Manual Trigger
#
# Runs `prisma migrate deploy` against the production database via
# the app container on qcet-network (Docker-internal hostname resolves).
#
# Security:
#   - DATABASE_URL read from running app container env (masked immediately)
#   - Migration runs inside app container which already has DATABASE_URL set
#   - PG credentials in chmod-600 files; never appear on CLI
#
# Usage:
#   gh workflow run migrate-production.yml -f confirm=migrate

name: Production Database Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'migrate' to confirm running prisma migrate deploy in production"
        required: true
        type: string

concurrency:
  group: production-migrate
  cancel-in-progress: false

env:
  # Python URL-parser script, base64-encoded to avoid heredoc/YAML conflicts.
  # Decodes to: parse DATABASE_URL env var, write components to argv file paths.
  PY_URL_PARSER: >-
    aW1wb3J0IG9zLCBzeXMKZnJvbSB1cmxsaWIucGFyc2UgaW1wb3J0IHVybHNwbGl0LCB1bnF1
    b3RlCnVybCA9IG9zLmVudmlyb24uZ2V0KCJEQVRBQkFTRV9VUkwiLCAiIikKdSA9IHVybHNw
    bGl0KHVybCkKdmFscyA9IFsKICAgIHVucXVvdGUodS51c2VybmFtZSBvciAiIiksCiAgICB1
    bnF1b3RlKHUucGFzc3dvcmQgb3IgIiIpLAogICAgdW5xdW90ZSh1Lmhvc3RuYW1lIG9yICJs
    b2NhbGhvc3QiKSwKICAgIHN0cih1LnBvcnQgb3IgNTQzMiksCiAgICB1bnF1b3RlKCh1LnBh
    dGgubHN0cmlwKCIvIikuc3BsaXQoIj8iKVswXSBpZiB1LnBhdGggZWxzZSAicG9zdGdyZXMi
    KSksCl0KZm9yIHBhdGgsIHZhbCBpbiB6aXAoc3lzLmFyZ3ZbMTpdLCB2YWxzKToKICAgIHdp
    dGggb3BlbihwYXRoLCAidyIpIGFzIGY6CiAgICAgICAgZi53cml0ZSh2YWwpCiAgICBvcy5j
    aG1vZChwYXRoLCAwbzYwMCkK

jobs:
  migrate:
    name: Prisma Migrate Deploy (Production)
    runs-on: [self-hosted, Linux, X64, qcet]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "migrate" ]; then
            echo "ERROR: Must type 'migrate' exactly to confirm." >&2
            exit 1
          fi
          echo "Confirmation accepted."

      - name: Find app container
        id: app
        run: |
          APP=$(docker ps --filter "name=qcet-app" --format '{{.Names}}' | head -1)
          if [ -z "$APP" ]; then
            APP=$(docker ps --filter "name=qcet" --format '{{.Names}}' \
              | grep -v "db\|clamav\|cloudflared\|tunnel" | head -1)
          fi
          if [ -z "$APP" ]; then
            echo "ERROR: No qcet app container is running." >&2
            docker ps --format '{{.Names}}' >&2
            exit 1
          fi
          echo "app_container=$APP" >> "$GITHUB_OUTPUT"
          echo "App container: $APP"
          if docker exec "$APP" sh -c "ls /app/node_modules/.bin/prisma" >/dev/null 2>&1; then
            echo "prisma CLI: found"
          else
            echo "ERROR: prisma CLI not found at /app/node_modules/.bin/prisma" >&2
            exit 1
          fi

      - name: Check migration status (pre-migrate)
        env:
          APP_CONTAINER: ${{ steps.app.outputs.app_container }}
        run: |
          echo "=== Current migration status ==="
          DOCKER_NET=$(docker inspect "$APP_CONTAINER" \
            --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' 2>/dev/null \
            | tr ' ' '\n' | grep -v '^$' | head -1)
          echo "Docker network: $DOCKER_NET"

          DB_URL=$(docker inspect "$APP_CONTAINER" \
            --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
            | grep '^DATABASE_URL=' | head -1 | cut -d= -f2-)
          echo "::add-mask::$DB_URL"

          TMPDIR_M=$(mktemp -d /tmp/migrate-check.XXXXXX)
          trap 'rm -rf "$TMPDIR_M"' EXIT

          # Decode and run Python URL parser (no heredoc = no YAML conflict)
          printf '%s' "$PY_URL_PARSER" | tr -d ' \n' | base64 -d > "$TMPDIR_M/parse.py"
          DATABASE_URL="$DB_URL" python3 "$TMPDIR_M/parse.py" \
            "$TMPDIR_M/pg_user" "$TMPDIR_M/pg_pass" \
            "$TMPDIR_M/pg_host" "$TMPDIR_M/pg_port" "$TMPDIR_M/pg_db"
          PG_USER=$(cat "$TMPDIR_M/pg_user")
          PG_PASS=$(cat "$TMPDIR_M/pg_pass")
          PG_HOST=$(cat "$TMPDIR_M/pg_host")
          PG_PORT=$(cat "$TMPDIR_M/pg_port")
          PG_DB=$(cat   "$TMPDIR_M/pg_db")
          echo "DB: host=$PG_HOST port=$PG_PORT db=$PG_DB user=$PG_USER" >&2

          ENV_FILE="$TMPDIR_M/pgenv"
          printf 'PGPASSWORD=%s\n' "$PG_PASS" > "$ENV_FILE"
          chmod 600 "$ENV_FILE"

          APPLIED=$(docker run --rm \
            --network "$DOCKER_NET" \
            --env-file "$ENV_FILE" \
            postgres:16-alpine \
            psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DB" -t -A \
              -c "SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL" \
            2>&1 | tr -d '[:space:]' || echo "PROBE_FAILED")
          echo "Applied migrations (before): $APPLIED"

          PENDING=$(docker run --rm \
            --network "$DOCKER_NET" \
            --env-file "$ENV_FILE" \
            postgres:16-alpine \
            psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DB" -t -A \
              -c "SELECT migration_name FROM _prisma_migrations WHERE finished_at IS NULL OR rolled_back_at IS NOT NULL ORDER BY started_at" \
            2>&1 || echo "none")
          echo "Migrations with issues (if any): ${PENDING:-none}"

          TOTAL_DIRS=$(find prisma/migrations -maxdepth 1 -mindepth 1 -type d | wc -l | tr -d ' ')
          echo "Migration directories in repo: $TOTAL_DIRS"

      - name: Run prisma migrate deploy (production)
        env:
          APP_CONTAINER: ${{ steps.app.outputs.app_container }}
        run: |
          echo "=== RUNNING: prisma migrate deploy ==="
          echo "Actor: @${{ github.actor }}"
          echo "SHA: ${{ github.sha }}"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker exec "$APP_CONTAINER" \
            sh -c "cd /app && node_modules/.bin/prisma migrate deploy 2>&1"
          echo "prisma migrate deploy: complete"

      - name: Verify migration success
        env:
          APP_CONTAINER: ${{ steps.app.outputs.app_container }}
        run: |
          echo "=== POST-MIGRATION VERIFICATION ==="
          DOCKER_NET=$(docker inspect "$APP_CONTAINER" \
            --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' 2>/dev/null \
            | tr ' ' '\n' | grep -v '^$' | head -1)

          DB_URL=$(docker inspect "$APP_CONTAINER" \
            --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
            | grep '^DATABASE_URL=' | head -1 | cut -d= -f2-)
          echo "::add-mask::$DB_URL"

          TMPDIR_V=$(mktemp -d /tmp/migrate-verify.XXXXXX)
          trap 'rm -rf "$TMPDIR_V"' EXIT

          printf '%s' "$PY_URL_PARSER" | tr -d ' \n' | base64 -d > "$TMPDIR_V/parse.py"
          DATABASE_URL="$DB_URL" python3 "$TMPDIR_V/parse.py" \
            "$TMPDIR_V/pg_user" "$TMPDIR_V/pg_pass" \
            "$TMPDIR_V/pg_host" "$TMPDIR_V/pg_port" "$TMPDIR_V/pg_db"
          PG_USER=$(cat "$TMPDIR_V/pg_user")
          PG_PASS=$(cat "$TMPDIR_V/pg_pass")
          PG_HOST=$(cat "$TMPDIR_V/pg_host")
          PG_PORT=$(cat "$TMPDIR_V/pg_port")
          PG_DB=$(cat   "$TMPDIR_V/pg_db")

          ENV_FILE="$TMPDIR_V/pgenv"
          printf 'PGPASSWORD=%s\n' "$PG_PASS" > "$ENV_FILE"
          chmod 600 "$ENV_FILE"

          APPLIED=$(docker run --rm \
            --network "$DOCKER_NET" \
            --env-file "$ENV_FILE" \
            postgres:16-alpine \
            psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DB" -t -A \
              -c "SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL" \
            2>&1 | tr -d '[:space:]' || echo "PROBE_FAILED")
          echo "Applied migrations (after): $APPLIED"

          FO_EXISTS=$(docker run --rm \
            --network "$DOCKER_NET" \
            --env-file "$ENV_FILE" \
            postgres:16-alpine \
            psql -h "$PG_HOST" -p "$PG_PORT" -U "$PG_USER" -d "$PG_DB" -t -A \
              -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_name='file_objects'" \
            2>&1 | tr -d '[:space:]' || echo "PROBE_FAILED")
          echo "file_objects exists (1=yes, 0=no): $FO_EXISTS"

          if [ "$FO_EXISTS" != "1" ]; then
            echo "ERROR: file_objects table still missing after migration!" >&2
            exit 1
          fi
          echo "VERIFIED: file_objects exists. Migration complete."

      - name: Summary
        if: always()
        run: |
          echo "### Production Migration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Actor: @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_STEP_SUMMARY"
