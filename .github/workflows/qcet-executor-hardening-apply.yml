name: QCET Executor Hardening Apply

on:
  push:
    branches:
      - fix/qcet-plan-executor-v1.5-hardening

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qcet-plan-executor-v1.5-hardening
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add regression tests
        run: python3 scripts/apply-executor-hardening-v15.py tests

      - name: Normalize cross-realm assertions
        run: python3 scripts/fix-executor-hardening-test.py

      - name: RED regression proof
        run: |
          set +e
          npx tsx --test tests/executor/workflow-executor.test.ts tests/executor/hooks.test.ts
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            exit 1
          fi
          echo "RED confirmed"

      - name: Fix patch anchor
        run: python3 scripts/fix-executor-hardening-anchor.py

      - name: Apply executor hardening
        run: python3 scripts/apply-executor-hardening-v15.py implementation

      - name: GREEN targeted executor tests
        run: npx tsx --test tests/executor/workflow-executor.test.ts tests/executor/hooks.test.ts

      - name: Configure git identity for worktree tests
        run: |
          git config user.name "qcet-executor-test"
          git config user.email "qcet-executor-test@users.noreply.github.com"

      - name: GREEN full executor suite
        run: npm run test:executor

      - name: Build executor bundle
        run: npm run build:executor

      - name: Commit verified changes
        run: |
          rm -f .github/workflows/qcet-executor-hardening-apply.yml
          rm -f scripts/apply-executor-hardening-v15.py
          rm -f scripts/fix-executor-hardening-test.py
          rm -f scripts/fix-executor-hardening-anchor.py
          rm -f .claude/executor-evals/.hardening-trigger
          git config user.name "qcet-executor-bot"
          git config user.email "qcet-executor-bot@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden QCET plan executor v1.5 [executor-hardening-applied]"
          git push origin HEAD:fix/qcet-plan-executor-v1.5-hardening
