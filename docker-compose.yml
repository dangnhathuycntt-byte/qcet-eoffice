services:
  qcet-db:
    container_name: qcet-eoffice-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qcet_eoffice}
      POSTGRES_USER: ${POSTGRES_USER:-qcet_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Vui long cung cap POSTGRES_PASSWORD trong .env.production}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    volumes:
      - qcet_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - qcet-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qcet_admin} -d ${POSTGRES_DB:-qcet_eoffice}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qcet-app:
    container_name: qcet-eoffice-app
    image: qcet-eoffice-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      qcet-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-qcet_admin}:${POSTGRES_PASSWORD}@qcet-db:5432/${POSTGRES_DB:-qcet_eoffice}?schema=public}
      JWT_SECRET: ${JWT_SECRET:?Vui long cung cap JWT_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://e-office.cdktcnqn.edu.vn}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://e-office.cdktcnqn.edu.vn}
      UPLOADS_DIR: /app/uploads
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${UPLOADS_HOST_PATH:?Vui long cung cap UPLOADS_HOST_PATH trong .env.production}:/app/uploads
    networks:
      - qcet-internal

networks:
  qcet-internal:
    name: qcet-network
    driver: bridge

volumes:
  qcet_postgres_data:
    name: qcet_postgres_data
    driver: local
