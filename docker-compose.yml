services:
  qcet-db:
    container_name: qcet-eoffice-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qcet_eoffice}
      POSTGRES_USER: ${POSTGRES_USER:-qcet_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Vui long cung cap POSTGRES_PASSWORD trong .env.production}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    volumes:
      - qcet_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - qcet-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qcet_admin} -d ${POSTGRES_DB:-qcet_eoffice}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: qcet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - qcet-internal

  qcet-app:
    container_name: qcet-eoffice-app
    image: qcet-eoffice-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      qcet-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      REDIS_URL: redis://redis:6379
      # Runtime credentials must be a dedicated least-privilege role. Never
      # fall back to the database owner used for bootstrap and migrations.
      DATABASE_URL: ${APP_DATABASE_URL:?Vui long cung cap APP_DATABASE_URL cho tai khoan ung dung it dac quyen}
      JWT_SECRET: ${JWT_SECRET:?Vui long cung cap JWT_SECRET}
      NEXTAUTH_URL: ${PUBLIC_APP_URL:-https://qcet.dixxie.store}
      NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://qcet.dixxie.store}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      FEATURE_EXTERNAL_GOOGLE_LOGIN: ${FEATURE_EXTERNAL_GOOGLE_LOGIN:-true}
      FEATURE_FLAG_TASK_WORKSPACE_V2: ${FEATURE_FLAG_TASK_WORKSPACE_V2:-true}
      FEATURE_FLAG_PUSH_NOTIFICATIONS: ${FEATURE_FLAG_PUSH_NOTIFICATIONS:-true}
      NEXT_PUBLIC_FEATURE_FLAG_MOBILE_AGENDA: ${NEXT_PUBLIC_FEATURE_FLAG_MOBILE_AGENDA:-true}
      UPLOADS_DIR: /app/uploads
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${PORT:-3001}:3000"
    volumes:
      - ${UPLOADS_HOST_PATH:?Vui long cung cap UPLOADS_HOST_PATH trong .env.production}:/app/uploads
    networks:
      - qcet-internal
    dns:
      - 8.8.8.8
      - 1.1.1.1

  qcet-tunnel:
    container_name: qcet-eoffice-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run qcet-tunnel
    volumes:
      - /home/dnhhuy/.cloudflared/514f4f82-5355-4eaa-840e-dfa3f548b61c.json:/etc/cloudflared/credentials.json:ro
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      - qcet-app
    networks:
      - qcet-internal

networks:
  qcet-internal:
    name: qcet-network
    driver: bridge

volumes:
  qcet_postgres_data:
    name: qcet_postgres_data
    driver: local
  redis-data:
    name: qcet_redis_data
    driver: local
