# =============================================================================
# Components
# =============================================================================
components:
  # ---------------------------------------------------------------------------
  # Security Schemes
  # ---------------------------------------------------------------------------
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: |
        NextAuth.js v5 session cookie. Set automatically on browser login.
        Secure; HttpOnly; SameSite=Lax.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token for programmatic / service-to-service access.
        Not yet implemented — reserved for future API client auth.

  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource identifier (cuid or uuid depending on entity)

    CursorParam:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: |
        Opaque pagination cursor returned by a previous response's
        `pagination.nextCursor`. Omit for the first page.

    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum items per page

    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: |
        ETag from a prior GET. When present, the server rejects the mutation
        with 409 Conflict if the resource has been modified since that ETag
        was issued (optimistic concurrency control).

  # ---------------------------------------------------------------------------
  # Headers
  # ---------------------------------------------------------------------------
  headers:
    ETag:
      schema:
        type: string
      description: |
        Entity tag for optimistic concurrency. Pass back as `If-Match`
        on subsequent mutations.

  # ---------------------------------------------------------------------------
  # Reusable Responses
  # ---------------------------------------------------------------------------
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: "https://qcet.edu.vn/problems/unauthorized"
            title: "Unauthorized"
            status: 401
            detail: "Valid session or bearer token required."

    Forbidden:
      description: Insufficient permissions
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: "https://qcet.edu.vn/problems/forbidden"
            title: "Forbidden"
            status: 403
            detail: "You do not have permission to perform this action."

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: "https://qcet.edu.vn/problems/not-found"
            title: "Not Found"
            status: 404
            detail: "The requested resource does not exist."

    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: "https://qcet.edu.vn/problems/validation-error"
            title: "Bad Request"
            status: 400
            detail: "Request body failed schema validation."
            errors:
              - field: "title"
                message: "Required"

    Conflict:
      description: Conflict — stale ETag or invalid state transition
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: "https://qcet.edu.vn/problems/conflict"
            title: "Conflict"
            status: 409
            detail: "Resource was modified by another request. Re-fetch and retry."

    UnprocessableEntity:
      description: Business rule violation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: "https://qcet.edu.vn/problems/business-rule-violation"
            title: "Unprocessable Entity"
            status: 422
            detail: "State transition not permitted: task is not in WAITING_APPROVAL state."

    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: "https://qcet.edu.vn/problems/internal-error"
            title: "Internal Server Error"
            status: 500
            detail: "An unexpected error occurred. A correlation ID has been logged."

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:
    # ·········································································
    # RFC 9457 Problem Details
    # ·········································································
    ProblemDetail:
      type: object
      description: |
        RFC 9457 Problem Details for HTTP APIs.
        Every error response in this API uses this envelope.
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: A URI reference identifying the problem type
          example: "https://qcet.edu.vn/problems/business-rule-violation"
        title:
          type: string
          description: Short human-readable summary of the problem type
          example: "Unprocessable Entity"
        status:
          type: integer
          description: HTTP status code
          example: 422
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence
          example: "Task is not in a state that allows approval."
        instance:
          type: string
          format: uri
          description: URI reference identifying this specific occurrence
        errors:
          type: array
          description: Field-level validation errors (optional extension)
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
              - field
              - message

    # ·········································································
    # Cursor Pagination
    # ·········································································
    CursorPaginationMeta:
      type: object
      description: |
        Cursor-based pagination metadata. Clients pass `nextCursor` as the
        `cursor` query parameter to fetch the next page. `hasMore` indicates
        whether additional pages exist.
      required:
        - hasMore
        - total
      properties:
        nextCursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page, or null if no more pages
        hasMore:
          type: boolean
          description: Whether more items exist beyond this page
        total:
          type: integer
          description: Total count of items matching the query (when available)

    # ·········································································
    # Task Schemas
    # ·········································································
    CreateTaskCommand:
      type: object
      description: "Skeleton — full field set TBD per WI-7.6"
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 500
        description:
          type: string
        priority:
          type: string
          enum: [URGENT, HIGH, NORMAL, LOW]
        dueDate:
          type: string
          format: date-time
        parentId:
          type: string
          description: Parent task ID for subtask creation
        assigneeIds:
          type: array
          items:
            type: string

    TaskSummary:
      type: object
      description: |
        Compact task representation for list views.
        Skeleton — additional fields TBD.
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          description: "Canonical lifecycle status (ADR-003)"
          enum: [NOT_STARTED, IN_PROGRESS, WAITING_APPROVAL, COMPLETED, CANCELLED]
        priority:
          type: string
          enum: [URGENT, HIGH, NORMAL, LOW]
        dueDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskDetail:
      type: object
      description: |
        Full task representation including relations.
        Skeleton — additional fields (actors, deliverables, approval process,
        hierarchy) TBD.
      allOf:
        - $ref: "#/components/schemas/TaskSummary"
        - type: object
          properties:
            description:
              type: string
              nullable: true
            createdBy:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
            parentId:
              type: string
              nullable: true
            childCount:
              type: integer
              description: Number of subtasks
            version:
              type: integer
              description: Optimistic concurrency version

    # ·········································································
    # Document Schema
    # ·········································································
    DocumentSummary:
      type: object
      description: |
        Document representation. Covers both incoming (văn bản đến) and
        outgoing (văn bản đi) documents. Skeleton — full field set TBD.
      properties:
        id:
          type: string
        documentNumber:
          type: string
          nullable: true
        title:
          type: string
        type:
          type: string
          enum: [VAN_BAN_DEN, VAN_BAN_DI, TO_TRINH_NOI_BO]
        status:
          type: string
          description: "Administrative status (Tier 1, NĐ 30/2020)"
        urgency:
          type: string
          enum: [THUONG, KHAN, THUONG_KHAN, HOA_TOC]
        securityLevel:
          type: string
          enum: [THUONG, MAT, TOI_MAT, TUYET_MAT]
        issuedDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ·································································��·······
    # Delegation Schema
    # ·········································································
    DelegationSummary:
      type: object
      description: |
        Delegation grant representation. Target model is position-based
        DelegationGrant (RFC-03 pending for unification with DacumDelegation).
        Skeleton.
      properties:
        id:
          type: string
        grantor:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        delegate:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        status:
          type: string
          enum: [ACTIVE, REVOKED, EXPIRED, PENDING]
        effectiveFrom:
          type: string
          format: date-time
        effectiveTo:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          nullable: true

    # ·········································································
    # Meeting Schema
    # ·········································································
    MeetingSummary:
      type: object
      description: |
        Meeting representation. Skeleton — full field set including
        participants, agenda, resolutions TBD.
      properties:
        id:
          type: string
        title:
          type: string
        status:
          type: string
          description: "Meeting lifecycle status"
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
          nullable: true
        location:
          type: string
          nullable: true
        organizerId:
          type: string
        createdAt:
          type: string
          format: date-time

    # ·········································································
    # Dossier Schema
    # ·········································································
    DossierSummary:
      type: object
      description: |
        Work Dossier (Hồ sơ công việc) representation.
        Follows NĐ 30/2020 archival lifecycle.
        Skeleton — full field set including items, retention rules TBD.
      properties:
        id:
          type: string
        code:
          type: string
        title:
          type: string
        status:
          type: string
          enum:
            - OPEN
            - ACTIVE
            - CLOSED
            - READY_FOR_ARCHIVE
            - SUBMITTED_TO_ARCHIVE
            - ACCEPTED
            - ARCHIVED
        owningUnitId:
          type: string
        responsiblePersonId:
          type: string
        openedAt:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true

  # ---------------------------------------------------------------------------
  # Tags
  # ---------------------------------------------------------------------------
tags:
  - name: Tasks
    description: |
      Work management — task CRUD and lifecycle business commands.
      Governed by ADR-001 (Maker-Checker SoD) and ADR-003 (Lifecycle semantics).
  - name: Documents
    description: |
      Document management — registration, incoming/outgoing workflows,
      and NĐ 30/2020 compliant lifecycle commands.
      Governed by ADR-004 (Document 2-tier status sync).
  - name: Delegations
    description: |
      Authority delegation grants and revocations.
      Target model: position-based DelegationGrant (RFC-03 pending).
  - name: Meetings
    description: |
      Meeting scheduling, lifecycle commands, and resolution management.
  - name: Dossiers
    description: |
      Work dossier (Hồ sơ công việc) management and NĐ 30/2020 archival lifecycle.
