# =============================================================================
# QCET E-Office — OpenAPI 3.1 Architecture Contract Skeleton
# Issue #34 Phase 0 Deliverable 3
#
# STATUS: SKELETON — structural contracts and schema shapes only.
# This file is NOT a complete production API specification.
# Endpoint bodies, query parameters, and response payloads are intentionally
# minimal; they establish the TARGET contract pattern that implementation
# work items will flesh out.
# =============================================================================

openapi: "3.1.0"

info:
  title: QCET E-Office API Architecture Skeleton
  version: 0.1.0-architecture
  description: |
    Architecture-level API contract skeleton for the QCET E-Office system.

    **Purpose**: Establish structural conventions — resource paths, error format,
    pagination, security schemes, and business-command patterns — before any
    implementation work item begins. This is NOT a runnable specification.

    **Conventions encoded here**:
    - RESTful resource-oriented paths (`/api/{resource}`)
    - Explicit business commands via `POST /api/{resource}/{id}/actions/{verb}`
      — state transitions are NEVER performed through generic `PATCH {status}`
    - Cursor-based pagination on every list endpoint
    - Optimistic concurrency via `ETag` / `If-Match` on mutations
    - RFC 9457 Problem Details (`application/problem+json`) for ALL errors
    - Deny-by-default authorization enforced server-side

    **Scope**: Core resources only — Tasks, Documents, Delegations, Meetings,
    Dossiers. Auth, notifications, push, health, and platform routes are
    documented in the route inventory (`docs/architecture/migration-map.md`)
    but omitted from this skeleton.
  contact:
    name: QCET Architecture Team
  license:
    name: Proprietary
    identifier: LicenseRef-QCET

servers:
  - url: http://localhost:3000
    description: Local development

# =============================================================================
# Security
# =============================================================================
security:
  - sessionCookie: []
  - bearerAuth: []

# =============================================================================
# Paths — Core Resource Skeletons
# =============================================================================
paths:
  # ---------------------------------------------------------------------------
  # TASKS
  # ---------------------------------------------------------------------------
  /api/tasks:
    x-architecture-notes: |
      Skeleton. Full query filters (status, scope, assignee, dueDate, priority,
      parentId) and request body shape will be specified per WI-7.6.
    get:
      operationId: listTasks
      summary: List tasks (cursor-paginated)
      tags: [Tasks]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CursorParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated task list
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaskSummary"
                  pagination:
                    $ref: "#/components/schemas/CursorPaginationMeta"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createTask
      summary: Create a new task
      tags: [Tasks]
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskCommand"
      responses:
        "201":
          description: Task created
          headers:
            Location:
              schema:
                type: string
                format: uri
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      operationId: getTask
      summary: Get task detail
      tags: [Tasks]
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: Task detail
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/tasks/{id}/actions/start:
    x-architecture-notes: |
      Business command. Transitions task lifecycle from NOT_STARTED → IN_PROGRESS.
      Guarded by State Machine (ADR-003) and authorization engine.
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: startTask
      summary: Start a task (business command)
      tags: [Tasks]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  description: Optional note when starting the task
      responses:
        "200":
          description: Task started
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/tasks/{id}/actions/submit-result:
    x-architecture-notes: |
      Business command. Submits deliverables/result for review.
      Transitions IN_PROGRESS → WAITING_APPROVAL.
      Subject to Maker-Checker SoD (ADR-001): submitter cannot approve.
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: submitTaskResult
      summary: Submit task result for review (business command)
      tags: [Tasks]
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                summary:
                  type: string
                attachmentIds:
                  type: array
                  items:
                    type: string
              required: [summary]
      responses:
        "200":
          description: Result submitted
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/tasks/{id}/actions/approve:
    x-architecture-notes: |
      Business command. Approves a submitted task result.
      Transitions WAITING_APPROVAL → COMPLETED.
      Subject to Maker-Checker SoD (ADR-001): approver ≠ maker.
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      operationId: approveTask
      summary: Approve task result (business command)
