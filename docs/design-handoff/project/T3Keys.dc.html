<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:#FAFBFC;color:#1A1D23}
button{font-family:inherit;cursor:pointer;border:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.nv{display:flex;align-items:center;gap:12px;height:33px;padding:0 10px;border-radius:12px;color:#3A3D44;font-size:15px;text-decoration:none}
.nv.on{background:#DEE2E8;color:#1A1D23;font-weight:500}
.ib{width:30px;height:30px;border:0;border-radius:12px;background:transparent;color:#3A3D44;display:flex;align-items:center;justify-content:center}
.av{width:22px;height:22px;border-radius:50%;background:#F2F4F7;font-size:10px;font-weight:600;color:#3A3D44;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.avb{background:#DEE2E8;color:#1A1D23}
.kv{display:grid;grid-template-columns:118px minmax(0,1fr);row-gap:18px;font-size:15px;align-items:start}
.kv>span:nth-child(odd){color:#3A3D44}
.kv>span:nth-child(even){display:flex;align-items:center;gap:8px}
.tab{height:32px;padding:0 14px;border-radius:16px;font-size:14px;border:0;background:transparent;color:#3A3D44;display:inline-flex;align-items:center;gap:8px}
.av{overflow:hidden}.av svg{display:block}.ph1{background:#B9C7D6!important}.ph2{background:#D6C7B9!important}.ph3{background:#C2D2BE!important}.ph4{background:#CDBFD6!important}

<div style="width:1000px;height:520px;position:relative;background:#fff;overflow:hidden;padding:48px 56px;box-sizing:border-box"><div style="font-size:22px;font-weight:600;letter-spacing:-.01em">Phím tắt</div><div style="display:grid;grid-template-columns:1fr 1fr;column-gap:64px"><div><div style="font-size:13px;color:#5F6671;margin:28px 0 6px">Trong danh sách</div><div style="display:flex;align-items:center;height:44px;font-size:14px"><span style="flex:1">Tạo việc mới</span><span style="display:flex;gap:6px"><span style="min-width:26px;height:26px;padding:0 8px;border-radius:8px;background:#F2F4F7;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:#3A3D44">C</span></span></div><div style="display:flex;align-items:center;height:44px;font-size:14px"><span style="flex:1">Xuống, lên một dòng</span><span style="display:flex;gap:6px"><span style="min-width:26px;height:26px;padding:0 8px;border-radius:8px;background:#F2F4F7;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:#3A3D44">J</span><span style="min-width:26px;height:26px;padding:0 8px;border-radius:8px;background:#F2F4F7;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:#3A3D44">K</span></span></div><div style="display:flex;align-items:center;height:44px;font-size:14px"><span style="flex:1">Mở việc đang chọn</span><span style="display:flex;gap:6px"><span style="min-width:26px;height:26px;padding:0 8px;border-radius:8px;background:#F2F4F7;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:#3A3D44">Enter</span></span></div><div style="display:flex;align-items:center;height:44px;font-size:14px"><span style="flex:1">Chọn dòng</span><span style="display:flex;gap:6px"><span style="min-width:26px;height:26px;padding:0 8px;border-radius:8px;background:#F2F4F7;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:#3A3D44">X</span></span></div><div style="display:flex;align-items:center;height:44px;font-size:14px"><span style="flex:1">Chọn nhiều dòng</span><span style="display:flex;gap:6px"><span style="min-width:26px;height:26px;padding:0 8px;border-radius:8px;background:#F2F4F7;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:#3A3D44">Shift</span><span style="min-width:26px;height:26px;padding:0 8px;border-radius:8px;background:#F2F4F7;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:#3A3D44">↑↓</span></span></div><div style="display:flex;align-items:center;height:44px;font-size:14px"><span style="flex:1">Tìm kiếm</span><span style="display:flex;gap:6px"><span style="min-width:26px;height:26px;padding:0 8px;border-radius:8px;background:#F2F4F7;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:#3A3D44">/</span></span></div><div style="display:flex;align-items:center;height:44px;font-size:14px"><span style="flex:1">Bộ lọc</span><span style="display:flex;gap:6px"><span style="min-width:26px;height:26px;padding:0 8px;border-radius:8px;background:#F2F4F7;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:#3A3D44">F</span></span></div></div><div><div style="font-size:13px;color:#5F6671;margin:28px 0 6px">Trong một việc</div><div style="display:flex;align-items:center;height:44px;font-size:14px"><span style="flex:1">Đổi tình trạng</span><span style="display:flex;gap:6px"><span style="min-width:26px;height:26px;padding:0 8px;border-radius:8px;background:#F2F4F7;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:#3A3D44">S</span></span></div><div style="display:flex;align-items:center;height:44px;font-size:14px"><span style="flex:1">Đổi người phụ trách</span><span style="display:flex;gap:6px"><span style="min-width:26px;height:26px;padding:0 8px;border-radius:8px;background:#F2F4F7;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:#3A3D44">A</span></span></div><div style="display:flex;align-items:center;height:44px;font-size:14px"><span style="flex:1">Đổi hạn</span><span style="display:flex;gap:6px"><span style="min-width:26px;height:26px;padding:0 8px;border-radius:8px;background:#F2F4F7;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:#3A3D44">D</span></span></div><div style="display:flex;align-items:center;height:44px;font-size:14px"><span style="flex:1">Gửi bình luận hoặc Gửi duyệt</span><span style="display:flex;gap:6px"><span style="min-width:26px;height:26px;padding:0 8px;border-radius:8px;background:#F2F4F7;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:#3A3D44">Ctrl</span><span style="min-width:26px;height:26px;padding:0 8px;border-radius:8px;background:#F2F4F7;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:#3A3D44">Enter</span></span></div><div style="display:flex;align-items:center;height:44px;font-size:14px"><span style="flex:1">Đóng, bỏ chọn</span><span style="display:flex;gap:6px"><span style="min-width:26px;height:26px;padding:0 8px;border-radius:8px;background:#F2F4F7;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:#3A3D44">Esc</span></span></div><div style="font-size:13px;color:#5F6671;margin:28px 0 6px">Ở mọi nơi</div><div style="display:flex;align-items:center;height:44px;font-size:14px"><span style="flex:1">Mở bảng phím tắt</span><span style="display:flex;gap:6px"><span style="min-width:26px;height:26px;padding:0 8px;border-radius:8px;background:#F2F4F7;font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:#3A3D44">?</span></span></div></div></div></div>
